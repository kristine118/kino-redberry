
<div class="login-form">

  <div class="form-header">
    <div>
      <h2>Log in</h2>
      <p>Welcome Back to Kino XII</p>
    </div>
    <button type="button" class="close-btn" aria-label="Close" (click)="modal.close()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.9792 5.96654L11.8388 1.10689C11.9481 0.979367 12.0051 0.815328 11.9986 0.647556C11.9922 0.479784 11.9226 0.320636 11.8039 0.201915C11.6852 0.0831934 11.526 0.0136432 11.3583 0.00716286C11.1905 0.000682555 11.0264 0.0577495 10.8989 0.166959L6.03926 5.02661L1.17961 0.160293C1.05209 0.0510832 0.888047 -0.00598315 0.720275 0.000497155C0.552503 0.00697746 0.393356 0.0765271 0.274634 0.195248C0.155913 0.313969 0.0863629 0.473117 0.0798825 0.640889C0.0734022 0.808661 0.130469 0.9727 0.239679 1.10023L5.09933 5.96654L0.233013 10.8262C0.16323 10.886 0.106554 10.9595 0.066541 11.0422C0.0265283 11.1249 0.00404283 11.215 0.000496751 11.3068C-0.00304932 11.3986 0.0124202 11.4901 0.0459342 11.5757C0.0794481 11.6612 0.130283 11.7389 0.195249 11.8039C0.260214 11.8689 0.337906 11.9197 0.42345 11.9532C0.508994 11.9867 0.600543 12.0022 0.692349 11.9986C0.784155 11.9951 0.874237 11.9726 0.956941 11.9326C1.03964 11.8926 1.11318 11.8359 1.17295 11.7661L6.03926 6.90648L10.8989 11.7661C11.0264 11.8753 11.1905 11.9324 11.3583 11.9259C11.526 11.9194 11.6852 11.8499 11.8039 11.7312C11.9226 11.6125 11.9922 11.4533 11.9986 11.2855C12.0051 11.1178 11.9481 10.9537 11.8388 10.8262L6.9792 5.96654Z" fill="white"/>
      </svg>
    </button>
  </div>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()">

    <div class="field" [class.invalid]="isInvalid('email')" [class.valid]="isValid('email')">
      <label for="email">Email</label>
      <div class="input-wrap">
        <input id="email" type="email" formControlName="email" placeholder="example@gmail.com">
          <span class="icon icon-error">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.9718 2.00049C4.679 2.00049 2 4.69209 2 8.00049C2 11.3089 4.6916 14.0005 8 14.0005C11.3084 14.0005 14 11.3089 14 8.00049C14 4.69209 11.2958 2.00049 7.9718 2.00049ZM8 12.8005C5.3534 12.8005 3.2 10.6471 3.2 8.00049C3.2 5.35389 5.3402 3.20049 7.9718 3.20049C10.6346 3.20049 12.8 5.35389 12.8 8.00049C12.8 10.6471 10.6466 12.8005 8 12.8005Z" />
              <path d="M7.40039 5H8.60039V9.2H7.40039V5ZM7.40039 9.8H8.60039V11H7.40039V9.8Z"/>
            </svg>
          </span>
          <span class="icon icon-ok">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M5.56395 10.9722L2.90031 8.30853C2.83066 8.23803 2.74771 8.18205 2.65626 8.14385C2.56481 8.10564 2.46669 8.08597 2.36759 8.08597C2.26848 8.08597 2.17036 8.10564 2.07891 8.14385C1.98747 8.18205 1.90451 8.23803 1.83486 8.30853C1.76436 8.37818 1.70838 8.46113 1.67018 8.55258C1.63198 8.64403 1.6123 8.74215 1.6123 8.84125C1.6123 8.94036 1.63198 9.03848 1.67018 9.12993C1.70838 9.22137 1.76436 9.30433 1.83486 9.37398L5.02361 12.5627C5.32041 12.8595 5.79987 12.8595 6.09667 12.5627L14.1637 4.50334C14.2342 4.43369 14.2901 4.35074 14.3284 4.25929C14.3666 4.16784 14.3862 4.06972 14.3862 3.97062C14.3862 3.87151 14.3666 3.77339 14.3284 3.68194C14.2901 3.5905 14.2342 3.50754 14.1637 3.43789C14.094 3.36739 14.0111 3.31141 13.9196 3.27321C13.8282 3.235 13.73 3.21533 13.6309 3.21533C13.5318 3.21533 13.4337 3.235 13.3423 3.27321C13.2508 3.31141 13.1679 3.36739 13.0982 3.43789L5.56395 10.9722Z" />
            </svg>
          </span>
      </div>

      @if(form.controls.email.touched){
        @if(form.controls.email.hasError('required')){
          <small class="error">Email is required</small>
        }
        @else if(form.controls.email.hasError('email')){
          <small class="error">Enter a valid email</small>
        }
      }
    </div>

    <div class="field" [class.invalid]="isInvalid('password')" [class.valid]="isValid('password')">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input id="password" type="password" formControlName="password" placeholder="••••••••">
          <span class="icon icon-error">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.9718 2.00049C4.679 2.00049 2 4.69209 2 8.00049C2 11.3089 4.6916 14.0005 8 14.0005C11.3084 14.0005 14 11.3089 14 8.00049C14 4.69209 11.2958 2.00049 7.9718 2.00049ZM8 12.8005C5.3534 12.8005 3.2 10.6471 3.2 8.00049C3.2 5.35389 5.3402 3.20049 7.9718 3.20049C10.6346 3.20049 12.8 5.35389 12.8 8.00049C12.8 10.6471 10.6466 12.8005 8 12.8005Z" />
              <path d="M7.40039 5H8.60039V9.2H7.40039V5ZM7.40039 9.8H8.60039V11H7.40039V9.8Z"/>
            </svg>
          </span>
          <span class="icon icon-ok">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M5.56395 10.9722L2.90031 8.30853C2.83066 8.23803 2.74771 8.18205 2.65626 8.14385C2.56481 8.10564 2.46669 8.08597 2.36759 8.08597C2.26848 8.08597 2.17036 8.10564 2.07891 8.14385C1.98747 8.18205 1.90451 8.23803 1.83486 8.30853C1.76436 8.37818 1.70838 8.46113 1.67018 8.55258C1.63198 8.64403 1.6123 8.74215 1.6123 8.84125C1.6123 8.94036 1.63198 9.03848 1.67018 9.12993C1.70838 9.22137 1.76436 9.30433 1.83486 9.37398L5.02361 12.5627C5.32041 12.8595 5.79987 12.8595 6.09667 12.5627L14.1637 4.50334C14.2342 4.43369 14.2901 4.35074 14.3284 4.25929C14.3666 4.16784 14.3862 4.06972 14.3862 3.97062C14.3862 3.87151 14.3666 3.77339 14.3284 3.68194C14.2901 3.5905 14.2342 3.50754 14.1637 3.43789C14.094 3.36739 14.0111 3.31141 13.9196 3.27321C13.8282 3.235 13.73 3.21533 13.6309 3.21533C13.5318 3.21533 13.4337 3.235 13.3423 3.27321C13.2508 3.31141 13.1679 3.36739 13.0982 3.43789L5.56395 10.9722Z" />
            </svg>
          </span>
      </div>
    </div>

    @if(isInvalid('password')){
      <small class="error">Password is required</small>

    }


    <button type="submit" class="submit-btn" [disabled]="form.invalid">Log in</button>
  </form>

  <div class="switch">
    <p>Don't have an account?</p> 
    <button type="button" class="link-btn" (click)="modal.open('register')">Sign up</button>
  </div>

</div>
