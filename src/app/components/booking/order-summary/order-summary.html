<div class="summary">
  <span>summary</span>
  <div class="order-box">
    <div class="top-part">
      <span class="title">{{ session().movie.title }}</span>
      <span class="meta"
        >Hall {{ session().hall.name }} · {{ session().date | date: 'EEE d MMM' }} ·
        {{ session().time }}</span
      >
    </div>

    <div class="seats">
      <div class="line">
        <span>Seats</span>
        <span>{{ codes() }}</span>
      </div>
      <div class="line">
        <span>Tickets</span>
        <span>{{ tickets() }}</span>
      </div>
    </div>
  </div>
</div>
<app-booking-footer
  [label]="paying() ? 'Processing...' : 'Pay: Complete order'"
  [total]="hold().subtotal"
  [disabled]="paying()"
  (action)="pay.emit()"
/>
