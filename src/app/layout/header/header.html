<header class="header">
    
    <nav>
        <ul>
            <li><a href="/"><img src="/Frame.png" alt=""></a></li>
            <li><a href="/">SESSIONS</a></li>
        </ul>
    </nav>

    <div class="header-forms">
        <div class="search">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.21867 9.21867L12.25 12.25M10.5 6.125C10.5 8.54125 8.54125 10.5 6.125 10.5C3.70875 10.5 1.75 8.54125 1.75 6.125C1.75 3.70875 3.70875 1.75 6.125 1.75C8.54125 1.75 10.5 3.70875 10.5 6.125Z" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <input  type="search" placeholder="Search films and live events">

        </div>
        

        @if (auth.isLoggedIn()) {
        <div class="user-menu">
            {{ auth.user()?.username }}
        </div>
        } @else {
        <div class="auth-btns">
            <button type="button" class="signup" (click)="modal.open('register')">Sign up</button>
            <button type="button" class="login" (click)="modal.open('login')">Log in</button>
        </div>
        }
        
    </div>
</header>
