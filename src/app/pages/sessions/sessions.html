<main class="sessions-page">
  <div class="layout">
    <aside class="filters">
      <div class="filter-header">
        <h1>Sessions</h1>
        <span>Browse showtimes across all venues</span>
      </div>

      <app-filters-panel
        [filters]="filters()"
        (changed)="setFilter($event)"
        (cleared)="clearAll()"
      />
    </aside>

    <div class="results">
      <div class="results-head">
        @if (meta(); as showing) {
          <span>Showing {{ showing.totalSessions }} sessions</span>
        }

        <div class="sort">
          <label for="sort">Sort:</label>
          <select id="sort" (change)="onSortChange($event)">
            @for (s of options()?.sorts; track s.id) {
              <option [value]="s.id" [selected]="s.id === currentSort()">{{ s.label }}</option>
            }
          </select>
        </div>
      </div>

      @if (loading()) {
        <p class="state">Loading...</p>
      } @else if (groups().length === 0) {
        <p class="state">No sessions found</p>
      } @else {
        @for (group of groups(); track group.movie.id) {
          <app-movie-sessions [group]="group" />
        }
      }
      @if (meta(); as m) {
        <app-pagination [meta]="m" (pageChange)="goToPage($event)" />
      }
    </div>
  </div>
</main>
